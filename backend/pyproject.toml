[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentropolis-backend"
version = "0.1.0"
description = "Standalone Agentropolis autonomous economy backend"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0,<2",
  "fastapi>=0.110",
  "httpx>=0.27",
  "openai>=1.50",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "uagents>=0.22",
  "uagents-core>=0.4",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
x402 = ["x402[evm,httpx]>=2.25,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
