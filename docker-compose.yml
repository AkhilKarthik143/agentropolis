services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - agentropolis-data:/app/backend/.data

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  agentropolis-data:
