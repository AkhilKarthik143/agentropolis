services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - agentropolis-data:/app/backend/.data

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  agentropolis-data:
